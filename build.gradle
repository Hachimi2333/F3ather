import java.security.MessageDigest

plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'top.hachimi2333'
version = modVersion

base {
    archivesName = 'f3ather'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository {
            ivy {
                // Map the public release to its upstream coordinates for Jar-in-Jar negotiation.
                url = 'https://cursemaven.com'
                patternLayout {
                    artifact 'curse/maven/openui-mc-1661978/9426213/openui-mc-1661978-9426213.[ext]'
                }
                metadataSources { artifact() }
            }
        }
        filter { includeVersion('com.nstut', 'openui-mc-neoforge-1.21.1', '0.0.16') }
    }
    if (providers.gradleProperty('useChinaMirrors').get().toBoolean()) {
        def centralMirror = maven {
            name = 'Aliyun Maven Central'
            url = 'https://maven.aliyun.com/repository/central'
            content {
                excludeGroupByRegex('net\\.neoforged(\\..*)?')
                excludeGroupByRegex('com\\.mojang(\\..*)?')
            }
        }
        // Prefer the mirror for Central artifacts while keeping dedicated repositories for excluded groups.
        remove(centralMirror)
        add(0, centralMirror)
    }
    mavenCentral()
}

sourceSets {
    fixture
    fixturePeer
}

sourceSets.fixture.compileClasspath += sourceSets.main.output

dependencies {
    def openUi = 'com.nstut:openui-mc-neoforge-1.21.1:0.0.16'
    compileOnly(openUi)
    fixtureCompileOnly(openUi)
    jarJar(openUi) {
        version { strictly '[0.0.16]' }
    }
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('verifyOpenUi') {
    def openUiJar = configurations.compileClasspath.incoming.artifactView {
        componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                it.group == 'com.nstut' && it.module == 'openui-mc-neoforge-1.21.1' }
    }.files
    inputs.files(openUiJar)
    doLast {
        def digest = MessageDigest.getInstance('SHA-256')
                .digest(openUiJar.singleFile.bytes).encodeHex().toString()
        if (digest != 'cc2ba4e10cc4e5aeca8589d7305148c8379a5b9f9198a0e17cceefdb94c75894') {
            throw new GradleException('OpenUI MC 0.0.16 checksum mismatch')
        }
    }
}

tasks.named('compileJava') { dependsOn('verifyOpenUi') }

tasks.named('test', Test) {
    workingDir = layout.buildDirectory.get().asFile
    useJUnitPlatform()
}

def fixtureDirectory = providers.gradleProperty('fixtureBaseline').isPresent() ? 'fixture-baseline'
        : providers.gradleProperty('fixtureServer').isPresent() ? 'fixture-network' : 'fixture'

neoForge {
    version = neoVersion
    addModdingDependenciesTo sourceSets.fixture
    addModdingDependenciesTo sourceSets.fixturePeer
    addModdingDependenciesTo sourceSets.test
    mods {
        f3ather { sourceSet sourceSets.main }
        f3ather_fixture { sourceSet sourceSets.fixture }
        f3ather_fixture_peer { sourceSet sourceSets.fixturePeer }
    }
    runs {
        client {
            client()
            gameDirectory = layout.buildDirectory.dir('client').get().asFile
            loadedMods = []
        }
        fixtureClient {
            client()
            sourceSet = sourceSets.fixture
            systemProperty 'f3ather.fixture.baseline', providers.gradleProperty('fixtureBaseline').isPresent().toString()
            gameDirectory = layout.buildDirectory.dir(fixtureDirectory).get().asFile
            loadedMods = [mods.f3ather_fixture, mods.f3ather_fixture_peer]
            if (providers.gradleProperty('fixtureAuto').isPresent()) {
                systemProperty 'f3ather.fixture.auto', 'true'
            }
            if (providers.gradleProperty('fixtureVisual').isPresent()) {
                systemProperty 'f3ather.fixture.visual', 'true'
            }
            def hostPort = providers.gradleProperty('fixtureHost').orNull
            if (hostPort != null) {
                systemProperty 'f3ather.fixture.host', hostPort
            }
            def world = providers.gradleProperty('fixtureWorld').orNull
            if (world != null) {
                programArguments.addAll '--quickPlaySingleplayer', world
            }
            def serverAddress = providers.gradleProperty('fixtureServer').orNull
            if (serverAddress != null) {
                systemProperty 'f3ather.fixture.network', 'true'
                programArguments.addAll '--username', 'FixtureGuest', '--quickPlayMultiplayer', serverAddress
            }
        }
        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods.f3ather]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    def metadata = [
        modVersion: modVersion,
        minecraftVersion: minecraftVersion,
        minimumNeoVersion: minimumNeoVersion
    ]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadata
    }
}

tasks.named('jar', Jar) {
    from('LICENSE')
}

// Exercise the single production JAR through NeoForge's normal mods folder discovery.
['Client': 'client', 'FixtureClient': fixtureDirectory].each { suffix, directory ->
    if (suffix != 'FixtureClient' || !providers.gradleProperty('fixtureBaseline').isPresent()) {
        def stage = tasks.register("stage${suffix}Mod", Copy) {
            from(tasks.named('jar', Jar))
            into(layout.buildDirectory.dir("${directory}/mods"))
            rename { 'f3ather-under-test.jar' }
        }
        tasks.named("run${suffix}") { dependsOn(stage) }
    }
}
