plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'io.github.hachimi2333.f3ather'
version = modVersion

base {
    archivesName = 'f3ather'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    if (providers.gradleProperty('useChinaMirrors').get().toBoolean()) {
        def centralMirror = maven {
            name = 'Aliyun Maven Central'
            url = 'https://maven.aliyun.com/repository/central'
            content {
                excludeGroupByRegex('net\\.neoforged(\\..*)?')
                excludeGroupByRegex('com\\.mojang(\\..*)?')
            }
        }
        // Prefer the mirror for Central artifacts while keeping dedicated repositories for excluded groups.
        remove(centralMirror)
        add(0, centralMirror)
    }
    mavenCentral()
}

sourceSets {
    fixture
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

neoForge {
    version = neoVersion
    addModdingDependenciesTo sourceSets.fixture
    mods {
        f3ather { sourceSet sourceSets.main }
        f3ather_fixture { sourceSet sourceSets.fixture }
    }
    runs {
        client {
            client()
            loadedMods = [mods.f3ather]
        }
        fixtureClient {
            client()
            gameDirectory = project.file('runs/fixture')
            loadedMods = providers.gradleProperty('fixtureBaseline').isPresent()
                    ? [mods.f3ather_fixture] : [mods.f3ather, mods.f3ather_fixture]
            if (providers.gradleProperty('fixtureAuto').isPresent()) {
                systemProperty 'f3ather.fixture.auto', 'true'
            }
            def world = providers.gradleProperty('fixtureWorld').orNull
            if (world != null) {
                programArguments.addAll '--quickPlaySingleplayer', world
            }
            def serverAddress = providers.gradleProperty('fixtureServer').orNull
            if (serverAddress != null) {
                programArguments.addAll '--quickPlayMultiplayer', serverAddress
            }
        }
        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods.f3ather]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    def metadata = [
        modVersion: modVersion,
        minecraftVersion: minecraftVersion,
        minimumNeoVersion: minimumNeoVersion
    ]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadata
    }
}

tasks.named('jar', Jar) {
    from('LICENSE')
}
